[tool.ruff]
line-length = 120
target-version = "py311"
cache-dir = ".temp/.ruff_cache"  # Keep the cache under .temp/.
extend-exclude = [
    "./dexjoco",
    "./robocasa",
    "./robosuite",
    "./Isaac-GR00T",
]  # Upstream code: Never lint or format.
force-exclude = true  # Enforce exclude patterns even for explicitly passed paths.

[tool.pytest.ini_options]
cache_dir = ".temp/.pytest_cache"
